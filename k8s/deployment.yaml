apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-price-api-deployment
  labels:
    app: mobile-price-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mobile-price-api
  template:
    metadata:
      labels:
        app: mobile-price-api
    spec:
      containers:
      - name: mobile-price-api
        image: mobile-price-prediction-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
